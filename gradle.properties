# Project-wide Gradle settings.

# AndroidX — required by every Android module (core/database's Room, and every
# future feature/*/app module's Compose/Hilt dependencies) per Google's migration
# off the legacy android.support.* libraries.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# JVM args for the Gradle daemon — this project has ~30 modules once feature/*
# is fully generated; default heap size is tuned for much smaller projects and
# would slow down or OOM CI builds as more modules come online.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Enables parallel module compilation — safe here since our module graph
# (domain/engine have no Android dependency, core/* has no feature/* dependency,
# feature/* modules don't depend on each other) has no circular edges that would
# make parallel builds nondeterministic.
org.gradle.parallel=true
org.gradle.caching=true

# Suppresses the "unsupported Gradle project" warning for CI log cleanliness —
# does not affect build correctness.
org.gradle.warning.mode=summary
